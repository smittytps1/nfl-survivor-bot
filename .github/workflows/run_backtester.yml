name: Run NFL Survivor 5-Year Backtester

on:
  workflow_dispatch:  # Enables manual button trigger

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy scipy gspread google-auth

      - name: Execute 5-Year Backtester
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python survivor_backtester.py
