name: NFL Survivor Bot Sheet Sync

on:
  schedule:
    - cron: '0 12 * * 2'
    - cron: '0 22 * * 5'
    - cron: '0 1 * * 0'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth pandas numpy scipy requests

      - name: Run Survivor Optimizer
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python nfl_survivor_bot.py
