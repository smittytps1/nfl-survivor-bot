name: NFL Survivor Bot Sheet Sync

on:
  schedule:
    # Runs Tuesday morning (12:00 UTC = 8:00 AM EDT)
    - cron: '0 12 * * 2'
    # Runs Friday evening (22:00 UTC = 6:00 PM EDT)
    - cron: '0 22 * * 5'
    # Runs Saturday night (01:00 UTC Sunday = 9:00 PM EDT Sat)
    - cron: '0 1 * * 0'
  workflow_dispatch: # Allows manual one-click trigger

jobs:
  run-survivor-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install gspread google-auth pandas numpy scipy requests

      - name: Execute Survivor Prediction Bot
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python nfl_survivor_bot.py
